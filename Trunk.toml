[build]
target = "index.html"
dist = "dist"
release = false
public_url = "/"

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false

# Reduction du bundle et page de repli 404 : voir scripts/post-build.ps1.
# L'option data-wasm-opt de Trunk n'est pas utilisable ici, elle passe a
# binaryen un chemin \?\ que celui-ci refuse d'ouvrir sous Windows.
[[hooks]]
stage = "post_build"
command = "powershell"
command_arguments = ["-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/post-build.ps1"]

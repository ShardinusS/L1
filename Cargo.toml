[package]
name = "classeur"
version = "0.1.0"
edition = "2021"
authors = ["Kenzo Metgy"]
description = "Classeur d'informatique L1 — application Leptos (CSR)"
publish = false

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.105"
leptos = { version = "0.8.20", features = ["csr"] }
leptos_meta = "0.8.6"
leptos_router = "0.8.15"
unicode-normalization = "0.1.25"
wasm-bindgen = "0.2.128"
web-sys = { version = "0.3.105", features = ["Window", "Document", "Element", "Clipboard", "HtmlElement", "HtmlInputElement", "Storage", "MediaQueryList", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition", "DomTokenList", "CssStyleDeclaration", "Navigator", "ServiceWorkerContainer", "ScrollToOptions", "EventTarget", "Location", "History", "DomStringMap", "MouseEvent", "KeyboardEvent", "FocusEvent"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
